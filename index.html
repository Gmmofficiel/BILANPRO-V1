<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BILANPRO</title>

<link rel="icon"
      type="image/png"
      sizes="192x192"
      href="icon-192.png">

<link rel="apple-touch-icon"
      href="icon-192.png">

<link rel="manifest"
      href="manifest.json">

<meta name="theme-color"
      content="#03060a">

<script
src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top,#17263b 0%,#080d15 45%,#03060a 100%);
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.app{
  min-height:100vh;
  max-width:900px;
  margin:auto;
  padding-bottom:40px;
}

/* TOPBAR */

.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  background:rgba(4,8,14,.85);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  position:sticky;
  top:0;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:900;
  letter-spacing:1px;
}

.logo{
  width:39px;
  height:39px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#d71920;
  box-shadow:0 0 22px rgba(215,25,32,.45);
  font-size:21px;
}

.brand span{
  color:#e21d25;
}

.clock{
  color:#9daaba;
  font-size:13px;
  font-weight:bold;
}

/* PAGES */

.page{
  display:none;
  padding:25px 18px;
  animation:fade .25s ease;
}

.page.active{
  display:block;
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* ACCUEIL */

.hero{
  text-align:center;
  padding:45px 10px 25px;
}

.heart-circle{
  width:125px;
  height:125px;
  margin:0 auto 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  font-size:58px;
  background:
    radial-gradient(circle,#e51d27,#8e1016);
  box-shadow:
    0 0 25px rgba(229,29,39,.5),
    0 0 80px rgba(229,29,39,.15);
  animation:pulse 2s infinite;
}

@keyframes pulse{

  50%{
    transform:scale(1.04);
  }

}

.hero h1{
  font-size:35px;
  letter-spacing:3px;
}

.hero h1 span{
  color:#e21d25;
}

.hero p{
  color:#8996a6;
  margin-top:10px;
}

.actions{
  display:grid;
  gap:12px;
  max-width:500px;
  margin:25px auto;
}

/* BOUTONS */

.main-btn{
  width:100%;
  padding:17px;
  border:0;
  border-radius:14px;
  color:#fff;
  background:
    linear-gradient(135deg,#d71920,#991018);
  font-size:15px;
  font-weight:900;
  box-shadow:
    0 8px 25px rgba(215,25,32,.2);
}

.secondary-btn{
  width:100%;
  padding:16px;
  border-radius:14px;
  color:#fff;
  background:#121c28;
  border:1px solid #29384b;
  font-weight:bold;
}

.main-btn:active,
.secondary-btn:active,
.choice:active{
  transform:scale(.98);
}

.pdf-btn{
  background:
    linear-gradient(135deg,#d71920,#7f0c12);
}

/* HEADER */

.page-header{
  margin-bottom:20px;
}

.page-header small{
  color:#e21d25;
  font-weight:bold;
  letter-spacing:1px;
}

.page-header h2{
  font-size:28px;
  margin-top:5px;
}

.page-header p{
  color:#8996a6;
  margin-top:7px;
}

/* PROGRESS */

.progress{
  display:flex;
  gap:6px;
  margin-bottom:25px;
}

.progress div{
  height:5px;
  flex:1;
  border-radius:10px;
  background:#1d2938;
}

.progress div.active{
  background:#d71920;
  box-shadow:
    0 0 10px rgba(215,25,32,.45);
}

/* CARDS */

.card{
  background:rgba(13,21,32,.92);
  border:1px solid #202e40;
  border-radius:17px;
  padding:18px;
  margin-bottom:15px;
}

.card-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:17px;
  font-size:18px;
  font-weight:900;
}

.badge{
  width:35px;
  height:35px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#d71920;
  font-weight:900;
}

/* CHAMPS */

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  color:#aab5c3;
  font-size:13px;
  margin-bottom:7px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #29384b;
  outline:none;
  background:#09111b;
  color:#fff;
  font-size:14px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#d71920;
}

textarea{
  min-height:85px;
  resize:vertical;
}

select option{
  background:#09111b;
}

/* XABCDE */

.assessment{
  padding:16px;
  margin-bottom:12px;
  border-radius:15px;
  background:#0c1521;
  border:1px solid #253448;
}

.assessment-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:12px;
}

.assessment-head strong{
  font-size:16px;
}

.assessment-head small{
  display:block;
  color:#778597;
  margin-top:3px;
}

.assessment-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.choice{
  padding:14px 10px;
  border-radius:11px;
  background:#101a27;
  color:#fff;
  border:1px solid #29384b;
  font-weight:bold;
}

.choice.selected{
  background:#8d1117;
  border-color:#e21d25;
}

.choice.normal.selected{
  background:#135a40;
  border-color:#19b879;
}

.result{
  display:none;
  margin-top:12px;
  padding:11px;
  background:#08131e;
  border-radius:9px;
  border-left:3px solid #d71920;
  color:#aeb9c8;
  font-size:12px;
  line-height:1.55;
}

.result.show{
  display:block;
}

/* SUMMARY */

.summary{
  background:#09131e;
  border:1px solid #27364a;
  border-radius:15px;
  padding:17px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.summary-row:last-child{
  border-bottom:0;
}

.summary-row span:first-child{
  color:#8190a2;
}

.summary-row span:last-child{
  text-align:right;
  font-weight:bold;
  word-break:break-word;
}

/* FOOTER */

.footer-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:20px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.8);
  z-index:100;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:700px;
  max-height:90vh;
  overflow:auto;
  padding:22px;
  background:#0d1723;
  border:1px solid #29384b;
  border-radius:22px 22px 0 0;
  animation:slideUp .25s ease;
}

@keyframes slideUp{

  from{
    transform:translateY(100%);
  }

  to{
    transform:translateY(0);
  }

}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#1b2735;
  color:#fff;
  font-size:21px;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:
    translateX(-50%)
    translateY(100px);
  padding:13px 18px;
  border-radius:12px;
  background:#142131;
  border:1px solid #33465e;
  z-index:200;
  opacity:0;
  transition:.3s;
  font-size:13px;
  width:max-content;
  max-width:90%;
  text-align:center;
}

.toast.show{
  transform:
    translateX(-50%)
    translateY(0);
  opacity:1;
}

/* INFO */

.info-box{
  padding:14px;
  border-radius:12px;
  background:#0a1720;
  border:1px solid #203849;
  color:#91a0b1;
  font-size:12px;
  line-height:1.5;
  margin-bottom:15px;
}

/* MOBILE */

@media(max-width:600px){

  .hero{
    padding-top:30px;
  }

  .hero h1{
    font-size:29px;
  }

  .page{
    padding:20px 13px;
  }

  .footer-actions{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="app">

<header class="topbar">

  <div class="brand">

    <div class="logo">♥</div>

    BILAN<span>PRO</span>

  </div>

  <div
    class="clock"
    id="clock">
    00:00:00
  </div>

</header>


<!-- PAGE 1 -->

<section
class="page active"
id="page1">

  <div class="hero">

    <div class="heart-circle">
      ♥
    </div>

    <h1>
      BILAN<span>PRO</span>
    </h1>

    <p>
      ÉVALUATION NUMÉRIQUE
    </p>

  </div>

  <div class="actions">

    <button
    class="main-btn"
    onclick="showPage(2)">
      ＋ NOUVELLE INTERVENTION
    </button>

    <button
    class="secondary-btn"
    onclick="showPage(4)">
      ▣ MES INTERVENTIONS
    </button>

    <button
    class="secondary-btn"
    onclick="showPage(6)">
      ⚙ PARAMÈTRES
    </button>

  </div>

</section>


<!-- PAGE 2 -->

<section
class="page"
id="page2">

  <div class="page-header">

    <small>ÉTAPE 01 / 04</small>

    <h2>Identité victime</h2>

    <p>
      Renseignez les informations disponibles.
    </p>

  </div>

  <div class="progress">
    <div class="active"></div>
    <div></div>
    <div></div>
    <div></div>
  </div>

  <div class="card">

    <div class="card-title">

      <div class="badge">👤</div>

      Identification

    </div>

    <div class="field">
      <label>NOM</label>
      <input
      id="nom"
      type="text"
      placeholder="Nom de la victime">
    </div>

    <div class="field">
      <label>PRÉNOM</label>
      <input
      id="prenom"
      type="text"
      placeholder="Prénom de la victime">
    </div>

    <div class="field">
      <label>ÂGE</label>
      <input
      id="age"
      type="number"
      placeholder="Âge">
    </div>

    <div class="field">
      <label>SEXE</label>

      <select id="sexe">

        <option value="">
          Sélectionner
        </option>

        <option>Homme</option>
        <option>Femme</option>
        <option>Autre / Non précisé</option>

      </select>

    </div>

    <div class="field">
      <label>ADRESSE / LIEU</label>

      <input
      id="lieu"
      type="text"
      placeholder="Lieu de prise en charge">

    </div>

    <div class="field">
      <label>MOTIF DE PRISE EN CHARGE</label>

      <textarea
      id="motif"
      placeholder="Motif, circonstances, plainte principale...">
      </textarea>

    </div>

  </div>

  <div class="footer-actions">

    <button
    class="secondary-btn"
    onclick="showPage(1)">
      ← Retour
    </button>

    <button
    class="main-btn"
    onclick="goToBilan()">
      Continuer →
    </button>

  </div>

</section>


<!-- PAGE 3 -->

<section
class="page"
id="page3">

  <div class="page-header">

    <small>ÉTAPE 02 / 04</small>

    <h2>Bilan XABCDE</h2>

    <p>
      Évaluation structurée de la victime.
    </p>

  </div>

  <div class="progress">
    <div class="active"></div>
    <div class="active"></div>
    <div></div>
    <div></div>
  </div>


<script>
</script>
